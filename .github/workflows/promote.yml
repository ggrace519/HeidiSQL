# AI Edition: opens and refreshes the develop -> lazarus promotion pull request after the Lazarus
# workflow passes on a develop push (shared ggrace519/.github workflow, pinned by commit).
# Merging it stays a manual decision; use a merge commit, never squash.
name: promote
on:
  workflow_run:
    workflows: [Lazarus]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: promote-develop-to-lazarus
  cancel-in-progress: true
jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    uses: ggrace519/.github/.github/workflows/promote.yml@8217a8363cd8f8222471a39df2a0892e0fec2c00 # v2.0.0
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      base: lazarus
      merge-note: "Merging publishes a release when AIEDITIONVERSION has no ai-v<version> tag yet; the release pull request sets the version (ADR-011)."
